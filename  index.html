<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OSD app</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0e1621; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .screen { display: none; flex-direction: column; height: 100%; }
        .screen.active { display: flex; }

        /* Шапка */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #17212b; }
        .header h1 { font-size: 20px; color: #58a6ff; }
        .header button { background: none; border: none; color: #fff; font-size: 14px; cursor: pointer; }

        /* Список чатов */
        .chat-list { flex: 1; overflow-y: auto; padding: 10px; }
        .chat-item { display: flex; align-items: center; padding: 15px; border-radius: 10px; cursor: pointer; }
        .chat-item:hover { background: #17212b; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; background: #2ea6ff; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; margin-right: 15px; }
        .chat-info { flex: 1; }
        .chat-name { font-size: 16px; font-weight: bold; }
        .chat-msg { font-size: 14px; color: #8b949e; margin-top: 5px; }

        /* Экран чата */
        .chat-header { display: flex; align-items: center; padding: 15px; background: #17212b; }
        .chat-header button { background: none; border: none; color: #58a6ff; font-size: 16px; margin-right: 15px; cursor: pointer; }
        .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 10px 15px; border-radius: 15px; font-size: 15px; word-wrap: break-word; }
        .msg.my { background: #2b5278; align-self: flex-end; border-bottom-right-radius: 5px; }
        .msg.their { background: #182533; align-self: flex-start; border-bottom-left-radius: 5px; }
        
        /* Поле ввода */
        .input-area { display: flex; padding: 10px; background: #17212b; gap: 10px; }
        .input-area input { flex: 1; padding: 12px; border-radius: 20px; border: none; background: #242f3d; color: #fff; outline: none; }
        .input-area button { padding: 12px 20px; border-radius: 20px; border: none; background: #2ea6ff; color: #fff; font-weight: bold; cursor: pointer; }

        /* Нижнее меню */
        .bottom-nav { display: flex; justify-content: space-around; background: #17212b; padding: 10px 0; }
        .nav-btn { background: none; border: none; color: #8b949e; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; }
        .nav-btn.active { color: #2ea6ff; }
        .nav-btn span { font-size: 20px; }

        /* Профиль */
        .profile-content { padding: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .profile-avatar { width: 100px; height: 100px; border-radius: 50%; background: #2ea6ff; display: flex; justify-content: center; align-items: center; font-size: 40px; font-weight: bold; }
        .profile-content input { width: 100%; padding: 15px; border-radius: 10px; border: none; background: #242f3d; color: #fff; font-size: 16px; text-align: center; }
        .profile-content button { width: 100%; padding: 15px; border-radius: 10px; border: none; background: #2ea6ff; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: СПИСОК ЧАТОВ -->
    <div id="screen-chats" class="screen active">
        <div class="header">
            <h1>OSD app</h1>
            <button onclick="alert('Настройки в разработке')">Настройки</button>
        </div>
        <div class="chat-list">
            <div class="chat-item" onclick="openChat()">
                <div class="avatar">⭐</div>
                <div class="chat-info">
                    <div class="chat-name">Избранное</div>
                    <div class="chat-msg">Твои сохраненные сообщения</div>
                </div>
            </div>
        </div>
        <div class="bottom-nav">
            <button class="nav-btn active"><span>💬</span>Чаты</button>
            <button class="nav-btn" onclick="showScreen('screen-profile')"><span>👤</span>Профиль</button>
        </div>
    </div>

    <!-- ЭКРАН 2: ЧАТ -->
    <div id="screen-chat" class="screen">
        <div class="chat-header">
            <button onclick="showScreen('screen-chats')">← Назад</button>
            <div class="chat-name">Избранное</div>
        </div>
        <div class="messages" id="messages">
            <div class="msg their">Привет! Это твои сохраненные сообщения.</div>
        </div>
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="Сообщение..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <!-- ЭКРАН 3: ПРОФИЛЬ -->
    <div id="screen-profile" class="screen">
        <div class="header">
            <h1>Профиль</h1>
            <button onclick="showScreen('screen-chats')">Назад</button>
        </div>
        <div class="profile-content">
            <div class="profile-avatar" id="avatar-letter">A</div>
            <input type="text" id="nickname" placeholder="Введи ник" value="Пользователь">
            <button onclick="saveProfile()">Сохранить</button>
        </div>
        <div class="bottom-nav">
            <button class="nav-btn" onclick="showScreen('screen-chats')"><span>💬</span>Чаты</button>
            <button class="nav-btn active"><span>👤</span>Профиль</button>
        </div>
    </div>

    <script>
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function openChat() {
            showScreen('screen-chat');
            document.getElementById('msg-input').focus();
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (text) {
                const messagesDiv = document.getElementById('messages');
                const newMsg = document.createElement('div');
                newMsg.className = 'msg my';
                newMsg.textContent = text;
                messagesDiv.appendChild(newMsg);
                input.value = '';
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function saveProfile() {
            const nick = document.getElementById('nickname').value;
            const avatar = document.getElementById('avatar-letter');
            if (nick) {
                avatar.textContent = nick[0].toUpperCase();
                alert('Ник сохранен: ' + nick);
            }
        }
    </script>
</body>
</html>
